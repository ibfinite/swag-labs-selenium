# Default settings. Any key can be overridden by a system property or an environment variable
# (key upper-cased, dots replaced by underscores), e.g.
#   ./gradlew test -Dheadless=true
#   USER_PASSWORD=... ./gradlew test
base.url=https://www.saucedemo.com
browser=chrome
headless=false
timeout.seconds=10
# Pause before each click, type and text read so a run can be followed by eye, e.g. -Dslow.motion.ms=500.
# Keep at 0 for normal runs.
slow.motion.ms=0

# Credentials. These are the public demo values shown on the SauceDemo login page, kept here so the
# project runs straight after cloning. A real project would leave them out and inject them as
# environment variables from CI secrets.
# Users follow the pattern user.<name>.username; all users share user.password.
user.standard.username=standard_user
user.password=secret_sauce